<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Волнуй</title>
  <link rel="icon" href="/img/logo-icon-blue.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="page pattern-bg">
  <div id="site-header"></div>

  <main class="auth">
    <form class="auth__panel" id="auth-form" data-mode="login" novalidate>
      <div class="auth__card">
        <h1 class="sr-only">Вход</h1>
        <div class="auth__tabs"><a href="/login" class="is-active">Вход</a><b>/</b><a href="/register">Регистрация</a></div>
        <label class="field"><input name="login" autocomplete="username" required><span>Логин</span></label>
        <label class="field"><input name="password" type="password" autocomplete="current-password" required><span>Пароль</span></label>
        <p class="auth__error" id="auth-error" role="alert"></p>
        <p class="auth__demo">Логин — почта или @имя. Демо: demo@volnuy.ru / demo123</p>
      </div>
      <button class="auth__submit" type="submit">Войти</button>
    </form>
  </main>
</div>
<script src="/js/common.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
